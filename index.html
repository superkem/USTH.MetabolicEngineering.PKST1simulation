<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Assembly Line Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a bench. Domain palette (one coloured area per BGC class) on the left,
   the assembly line + discrete-enzyme lane on top, the live structure on a white drawing board below. */
:root{
  --bg:#0e1621; --panel:#131f2e; --panel2:#182638; --line:#26384f; --ink:#f3f6fa; --mute:#9fb0c4;
  --acc:#22c55e; --acc-ink:#04210f; --err:#ef6a6a; --warn:#f0b429; --ok:#34d399;
  --cis:#4aa3f0; --trans:#a883f0; --nrps:#f0a43a; --rel:#8fa3ba;
  --hover:#1d2f45; --shadow:0 8px 24px rgba(0,0,0,.35);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf1f6; --panel:#ffffff; --panel2:#f3f6fa; --line:#d3dce8; --ink:#14202e; --mute:#56677c;
    --acc:#15803d; --acc-ink:#ffffff; --err:#c93a3a; --warn:#a86b00; --ok:#0b8a5f;
    --cis:#1f74c4; --trans:#7c4dcc; --nrps:#bd6f08; --rel:#5f7490; --hover:#e6edf6; --shadow:0 8px 24px rgba(20,32,46,.15);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf1f6; --panel:#ffffff; --panel2:#f3f6fa; --line:#d3dce8; --ink:#14202e; --mute:#56677c;
  --acc:#15803d; --acc-ink:#ffffff; --err:#c93a3a; --warn:#a86b00; --ok:#0b8a5f;
  --cis:#1f74c4; --trans:#7c4dcc; --nrps:#bd6f08; --rel:#5f7490; --hover:#e6edf6; --shadow:0 8px 24px rgba(20,32,46,.15);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 16px}
.top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font:700 clamp(18px,2.2vw,26px)/1.1 var(--f-display);letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--mute);font-size:12.5px;max-width:70ch}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:6px 10px;font-weight:600;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--mute);font-size:12.5px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:292px minmax(0,1fr);gap:12px}
/* ---------- palette ---------- */
#palette{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;position:relative}
.palscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
#palette.trash{outline:2px dashed var(--err);outline-offset:-4px}
#palette.trash::after{content:attr(data-trash);position:absolute;inset:auto 10px 10px 10px;background:var(--err);color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:600;z-index:3}
.sec{border:1.5px solid var(--cc);border-radius:12px;padding:8px 8px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 11%,transparent),transparent 70%)}
.sec h3{margin:0;font:600 13px var(--f-display);display:flex;align-items:center;gap:7px}
.sec h3 i{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.sec p{margin:2px 0 8px;color:var(--mute);font-size:11.5px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:8px 6px}
.chip,.pc,.mh,.gap,#boardWrap,.sec h3,.sec p{user-select:none;-webkit-user-select:none}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:61px;cursor:grab;touch-action:pan-y;border-radius:8px;padding:2px 0;background:none;border:0}
.chip:hover{background:var(--hover)}
.chip small{font-size:10px;color:var(--mute);text-align:center;line-height:1.1}
.cls-cis{--cc:var(--cis)} .cls-trans{--cc:var(--trans)} .cls-nrps{--cc:var(--nrps)} .cls-rel{--cc:var(--rel)}
#info{flex:none;max-height:42%;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--panel2);font-size:12.5px;line-height:1.45}
.chip .arm{display:none}
#info b{font-family:var(--f-display)}
#info .tag{font:600 10.5px var(--f-mono);color:var(--cc,var(--mute));text-transform:uppercase;letter-spacing:.06em}
/* ---------- domain pieces ---------- */
.dom{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-mono);color:#1d2530;background:var(--dc,#ddd);border:3px solid var(--cc,var(--rel));position:relative;user-select:none;-webkit-user-select:none;flex:none;cursor:grab}
.dom.box{border-radius:11px}
.dom.wide{width:auto;min-width:66px;padding:0 9px;border-style:dashed;white-space:nowrap}
.k-KS{--dc:#dba9ac}.k-KSQ{--dc:#e7b8a2}.k-AT{--dc:#d3ddcf}.k-ACP{--dc:#fbc98e}.k-KR{--dc:#a9d3d8}.k-KR0{--dc:#dde1e1}.k-DH{--dc:#c9bfe0}.k-ER{--dc:#f3dc9a}
.k-MT{--dc:#9fd3a0}.k-GTP{--dc:#e3d6b5}.k-tAT{--dc:#ffffff}.k-A{--dc:#d3ddcf}.k-T{--dc:#fbc98e}.k-C{--dc:#d9aeb0}.k-Cy{--dc:#a5cfc9}.k-TE{--dc:#b3b3dd}
.k-KR0 span{text-decoration:line-through;text-decoration-thickness:1.5px}
.dom .x{position:absolute;top:-9px;right:-9px;width:19px;height:19px;border-radius:50%;border:0;background:var(--err);color:#fff;font-size:12px;line-height:19px;padding:0;display:none}
.pc:hover .x,.pc:focus-within .x{display:block}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;touch-action:none}
.pc.ghosted{opacity:.3}
.pc.ins-before::before{content:"";position:absolute;left:-6px;top:0;height:44px;width:3px;background:var(--acc);border-radius:2px}
.mdom.ins-end::after{content:"";width:3px;height:44px;background:var(--acc);border-radius:2px;flex:none}
.arm{position:absolute;left:50%;top:41px;transform:translateX(-50%);pointer-events:none}
.arm text{font:600 8px var(--f-mono);fill:var(--mute)}
select.opt{background:var(--panel);border:1px solid var(--line);border-radius:7px;font-size:11px;padding:2px 3px;max-width:118px;touch-action:auto}
select.opt option,select.opt optgroup{background:var(--panel);color:var(--ink)}
/* ---------- assembly line ---------- */
#boardWrap{flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px}
#board{position:relative;width:max-content;min-width:100%;padding-right:14px}
#line{display:flex;align-items:stretch;gap:0}
.gap{display:flex;align-items:center;justify-content:center;width:26px;flex:none;border-radius:10px;color:var(--mute);font-size:18px;transition:width .12s}
.gap.last{width:132px;border:1.5px dashed var(--line);margin-left:4px;font-size:12px;text-align:center;padding:0 8px;line-height:1.3}
.gap.drop-ok{width:70px;background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--ink)}
.gap.last.drop-ok{width:132px}
.mod{background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-width:150px;display:flex;flex-direction:column;flex:none}
.mod.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.mod.cm{border-left:6px solid var(--mc);background:color-mix(in srgb,var(--mc) 9%,var(--panel2))}
.mod.cm:hover{box-shadow:0 0 0 2px var(--mc)}
.mod.drop-ok{outline:2px dashed var(--acc)}
.mod.drop-bad{outline:2px dashed var(--err)}
.mh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);font:600 12px var(--f-display)}
.mh .nm{border:0;background:none;font:inherit;padding:2px 4px;border-radius:6px;display:flex;gap:6px;align-items:center}
.mh .nm:hover{background:var(--hover)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.skip,.dot.empty{background:var(--line)}
.mh .sp{margin-left:auto;display:flex;gap:2px;align-items:center}
.ib{border:0;background:none;color:var(--mute);border-radius:6px;padding:1px 5px;font-size:13px;line-height:18px}
.ib:hover{background:var(--hover);color:var(--ink)}
.iter{display:inline-flex;align-items:center;gap:2px;font:600 11px var(--f-body);color:var(--nrps)}
.mdom{display:flex;gap:9px;padding:12px 10px 8px;position:relative;min-height:92px;align-items:flex-start}
.mdom::before{content:"";position:absolute;left:6px;right:6px;top:34px;height:3px;border-radius:2px;background:var(--line)}
.mdom .pc,.mdom .ph{position:relative;z-index:1}
.ph{color:var(--mute);font-size:11.5px;align-self:center;padding:0 6px;text-align:center;max-width:120px;line-height:1.3}
.mf{padding:0 8px 8px;display:flex;gap:4px;flex-wrap:wrap;font:500 10.5px var(--f-mono)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 7px;color:var(--mute);white-space:nowrap}
.pill.hl{color:var(--ink)}
.mf select{font-size:10.5px}
#lane{margin-top:26px;border:1.5px dashed var(--trans);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center;min-height:84px;position:relative}
#lane.drop-ok{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:var(--acc)}
#lane.drop-bad{border-color:var(--err)}
#lane .lt{position:absolute;top:-10px;right:14px;background:var(--panel);padding:0 6px;font:600 11.5px var(--f-display);color:var(--trans)}
#lane .lh{color:var(--mute);font-size:12px}
#links{position:absolute;inset:0;pointer-events:none;overflow:visible}
#links path{fill:none;stroke:var(--trans);stroke-width:1.6;stroke-dasharray:5 4;opacity:.9}
#links circle{fill:var(--trans)}
/* ---------- viewer ---------- */
#viewer{flex:1 0 auto;min-height:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.vtabs{display:flex;gap:4px;overflow:auto;padding-bottom:2px}
.vtabs button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px;font:600 12px var(--f-mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.vtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vtabs button:disabled{opacity:.4;cursor:default}
.vbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px}
.cwrap{display:flex;flex-direction:column;gap:6px;min-width:0}
#canvas{background:#fff;border-radius:12px;min-height:290px;flex:1;overflow:auto;display:grid;place-items:center;padding:10px;color:#1c2430}
#canvas svg{display:block;height:auto}
#canvas .empty{color:#6b7787;text-align:center;max-width:36ch}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--mute);font-size:11.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.vside{display:flex;flex-direction:column;gap:9px;min-width:0;overflow:auto}
.card{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel2)}
.card h4{margin:0 0 5px;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.formula{font:600 22px/1.1 var(--f-mono);letter-spacing:-.3px}
.formula sub{font-size:.62em}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{font-family:var(--f-mono);font-weight:500;text-align:right}
.match{margin-top:7px;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ink);font-size:12.5px}
.issue{display:flex;gap:7px;font-size:12.5px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.issue:first-of-type{border-top:0}
.issue b{font:600 10.5px var(--f-mono);border-radius:5px;padding:1px 5px;flex:none;margin-top:1px;color:#fff}
.issue.err b{background:var(--err)}.issue.warn b{background:var(--warn);color:#1b1500}.issue.info b{background:var(--rel)}
.log{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.log li.mh2{font:600 11.5px var(--f-mono);color:var(--mute);margin-top:4px}
.ok-line{color:var(--ok);font-size:12.5px}
/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:30;padding:14px 16px;overflow:auto;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column;gap:10px}
#drawer.on{transform:none}
#drawer h2{margin:0;font:700 18px var(--f-display)}
.tg{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel2);display:flex;flex-direction:column;gap:5px}
.tg .r1{display:flex;gap:8px;align-items:center}
.tg .r1 b{font:600 14px var(--f-display);margin-right:auto}
.tg code{font:500 12px var(--f-mono);color:var(--mute)}
.tg p{margin:0;font-size:12.5px;color:var(--mute)}
.tg .st{font:600 11px var(--f-mono);color:var(--ok)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:500;z-index:50;box-shadow:var(--shadow);max-width:min(90vw,520px)}
#ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
@media (max-width:1180px){.vbody{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  html,body{height:auto}
  #app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  #palette{max-height:300px}
  #viewer{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
/* ---------- structure -> line panel ---------- */
#pdrawer{position:fixed;top:0;right:0;bottom:0;width:min(960px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:32;padding:14px 16px 24px;overflow:auto;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column;gap:10px}
#pdrawer.on{transform:none}
#pdrawer h2{margin:0;font:700 18px var(--f-display)}
#pdrawer h4{margin:0 0 5px;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.pdhint{margin:0;color:var(--mute);font-size:12.5px;max-width:80ch}
#pdta{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:500 13px/1.4 var(--f-mono);resize:vertical}
.pdex{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:12.5px}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.edtools{display:flex;gap:6px;flex-wrap:wrap}
.edbox{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;cursor:crosshair;user-select:none;-webkit-user-select:none}
.edbox .ahit{fill:transparent;cursor:pointer}.edbox .ahit:hover,.edbox .ahit.on{fill:rgba(47,143,95,.28)}
.edbox .bhit:hover{stroke:rgba(47,143,95,.25)}
.edinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.edinfo code,.pdkv code{font:500 12.5px var(--f-mono);color:var(--ink);word-break:break-all}
.pdopts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.pdopts .lbl{color:var(--mute);font-size:12.5px}
.pdbanner{border-radius:10px;padding:9px 12px;font-size:13px;border:1px solid var(--line)}
.pdbanner.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok)}
.pdbanner.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:var(--warn)}
.pdbanner.err{background:color-mix(in srgb,var(--err) 14%,transparent);border-color:var(--err)}
.pdgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:760px){.pdgrid{grid-template-columns:minmax(0,1fr)}}
.pdcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.pdcanvas{background:#fff;border-radius:12px;padding:8px;overflow:auto;display:grid;place-items:center;color:#1c2430}
.pdkv{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--mute)}
.pdnote{font-size:12.5px;color:var(--mute)}
.pdmod{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pdmh{display:flex;gap:8px;align-items:baseline;font:600 12.5px var(--f-display)}
.pdmh span{color:var(--mute);font-weight:500}
.pdchips{display:flex;gap:8px 8px;flex-wrap:wrap;align-items:flex-start}
.pdchip{display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none}
.pdchip .dom{cursor:default;width:38px;height:38px;font-size:11.5px}
.pdchip .dom.wide{width:auto}
.pdchip small{font-size:10px;color:var(--mute);max-width:70px;text-align:center;line-height:1.1}
.iterb{align-self:center;font:600 12px var(--f-mono);color:var(--nrps)}
.pdmod ul,.pdnotes ul{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.pdnotes{border-top:1px solid var(--line);padding-top:8px;color:var(--mute)}
.pdact{display:flex;gap:8px}
#pdrawer>*{flex:none}
.pdchip .arm{display:none}
.pdcanvas svg{min-width:0!important;max-width:100%!important;height:auto}
#pdrawer>.seg,#pdrawer .edtools{align-self:flex-start}
.pdgrid{margin-top:4px}

.pdmod{border-left:6px solid var(--mc,var(--line));background:color-mix(in srgb,var(--mc,transparent) 10%,var(--panel2));cursor:pointer;transition:box-shadow .12s}
.pdmod:hover,.pdmod.on{box-shadow:0 0 0 2px var(--mc)}

/* ---------- practice tab ---------- */
#mainTabs button{font-weight:600}
#prac{position:fixed;top:0;right:0;bottom:0;width:388px;z-index:40;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);padding:12px 14px 20px;overflow:auto;display:none;flex-direction:column;gap:10px}
body.prac #prac{display:flex}
#prac>*{flex:none}
body.prac #app{padding-right:404px}
body.prac #drawer{right:388px;width:min(420px,calc(100% - 388px))}
body.prac #pdrawer{right:388px;width:min(960px,calc(100% - 388px))}
body.prac #drawer:not(.on),body.prac #pdrawer:not(.on){visibility:hidden}
.prhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prhead h2{margin:0;font:700 18px var(--f-display)}
.prhint{margin:0;color:var(--mute);font-size:12.5px}
.prgate{display:flex;gap:8px}
.prgate input{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit}
.prerr{color:var(--err);font-size:12.5px}
.prbar{height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.prbar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.prcount{font:600 11px var(--f-mono);color:var(--mute)}
.prtask{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.prtask>summary{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;list-style:none}
.prtask>summary::-webkit-details-marker{display:none}
.prtask>summary b{font:600 13px var(--f-display);margin-right:auto}
.prmin{font:500 11px var(--f-mono);color:var(--mute)}
.prmark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.prtask.done .prmark{background:var(--ok);border-color:var(--ok)}
.prbody{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.prbody ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.prgoal{margin:0;color:var(--mute)}
.prq{display:flex;gap:8px;align-items:center;justify-content:space-between}
.prq select{max-width:150px}
.pract{display:flex}
.prfb{font-size:12.5px;border-radius:8px;padding:0}
.prfb.ok,.prfb.no{padding:6px 8px}
.prfb.ok{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.prfb.no{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.prx summary{cursor:pointer;color:var(--mute);font-size:12px}
.prx p{margin:4px 0 0;font-size:12.5px}
@media (max-width:900px){
  body.prac #app{padding-right:16px;padding-bottom:58vh}
  #prac{top:auto;left:0;width:auto;height:56vh;border-left:0;border-top:1px solid var(--line)}
  body.prac #drawer,body.prac #pdrawer{right:0;width:100%;bottom:56vh}
}

.lockbar{position:sticky;top:-12px;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 16%,var(--panel));border:1px solid var(--warn);border-radius:10px;padding:7px 10px;font-size:12.5px}
.lockbar.open{background:color-mix(in srgb,var(--ok) 16%,var(--panel));border-color:var(--ok)}
.lockbar input{width:130px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit}
.prthink{margin:0}
.pransw{border:1px dashed var(--ok);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.pransw p{margin:0}

const newMod=(domains=[],iter=1)=>({id:pid(),domains,iter,atSrc:0});
let S={modules:[],trans:[]}, view='final', sel=-1, showNums=false, hist=[], hi=-1, SIM=null;

function allowedAT(m){const ks=m.domains.some(d=>d.type==='KS'),q=m.domains.some(d=>d.type==='KSQ');return(ks||q)?EXTENDERS:STARTERS}
function normalize(){
  S.modules.forEach(m=>{
    const al=allowedAT(m);
    m.domains.forEach(d=>{if(d.type==='AT'&&!al.includes(d.opts.sub))d.opts.sub=al[0]});
    if(!m.domains.some(d=>d.type==='KS'))m.iter=1;

const fadd=(F,d,s=1)=>{for(const k in d)F[k]=(F[k]||0)+s*d[k];return F};

const cloneAtoms=a=>a.map(x=>({...x,subs:x.subs.slice(),ring:x.ring?{...x.ring}:null}));
let AID=0;
const mkAtom=(el_,u,o)=>({id:++AID,el:el_,u,o:o||null,subs:[],dbl:false,aa:null,nh:null,ring:null});

const hasAny=(D,arr)=>D.some(d=>arr.includes(d.type));

             tagV+'AT nạp '+sp.n.toLowerCase()+'-CoA; KS ngưng tụ với chuỗi (mất CO₂): thêm 2 carbon'+(sp.R.length?', nhánh '+sp.R[0]+' mới':'')+'.');

function Canvas(){
  const c={hl:[],bd:[],lb:[],x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  const f=v=>Math.round(v*10)/10;
  c.bb=(x,y,r=3)=>{c.x0=Math.min(c.x0,x-r);c.x1=Math.max(c.x1,x+r);c.y0=Math.min(c.y0,y-r);c.y1=Math.max(c.y1,y+r)};
  c.line=(a,b,col,w=2)=>{c.bd.push(`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`);c.bb(a[0],a[1]);c.bb(b[0],b[1])};
  c.text=(s,x,y,col,sz=13,anchor='middle')=>{c.lb.push(`<text x="${f(x)}" y="${f(y)}" text-anchor="${anchor}" dominant-baseline="central" font-size="${sz}" font-weight="700" fill="${col}" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round" font-family="IBM Plex Sans,system-ui,sans-serif">${s}</text>`);c.bb(x,y,String(s).length*4.5+4)};
  c.circ=(p,r,fill,stroke)=>{c.hl.push(`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="4 3"/>`);c.bb(p[0],p[1],r)};
  c.poly=(pts,col,w=2)=>{for(let i=0;i<pts.length;i++)c.line(pts[i],pts[(i+1)%pts.length],col,w)};
  return c;
}
const vunit=v=>{const l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]};
const lbl=s=>s.replace('H2N','H₂N');

function structSVG(snap,opts){

  const ringMode=rel.kind==='lactone'||rel.kind==='lactam';
  const g=Canvas(),SS=28,HH=16,P=[],NN=[],TT=[];
  const col=a=>(opts.keep&&!opts.keep.has(a.u))?'#c3cad3':UCOL[(opts.umap?opts.umap[a.u]:a.u)%UCOL.length];
  let cen=null,X=null;
  if(!ringMode){
    for(let k=0;k<n;k++){const up=(k+1)%2===1;P.push([-SS*(k+1),up?-HH:0]);NN.push([0,up?-1:1]);TT.push([1,0])}

    if(hasX)X=Q(m+1);

    for(let k=m+1;k<n;k++){let nv;
      if(k<n-1){const u1=vunit([P[k-1][0]-P[k][0],P[k-1][1]-P[k][1]]),u2=vunit([P[k+1][0]-P[k][0],P[k+1][1]-P[k][1]]);nv=vunit([-(u1[0]+u2[0]),-(u1[1]+u2[1])])}

    const dAC=Math.hypot(Cc[0]-A[0],Cc[1]-A[1]),sh=Math.max(0,(dAC-32)/2),u=vunit([Cc[0]-A[0],Cc[1]-A[1]]);

    const cc=col(a);g.line(A,TA,cc);g.line(TA,TS,cc);g.line(TS,Cc,cc);
    g.text(a.ring.kind==='thz'?'S':'O',TS[0]+e[0]*3,TS[1]+e[1]*3,cc,13);
    const ctr=[(A[0]+B[0]+Cc[0]+TA[0]+TS[0])/5,(A[1]+B[1]+Cc[1]+TA[1]+TS[1])/5];dblToward[k+1]=ctr;
    if(a.ring.kind==='moxz'){const o=vunit([TA[0]-ctr[0],TA[1]-ctr[1]]);g.line(TA,[TA[0]+o[0]*20,TA[1]+o[1]*20],cc);g.text('Me',TA[0]+o[0]*30,TA[1]+o[1]*30,cc,13)}

    if(toward){if((toward[0]-mid[0])*w[0]+(toward[1]-mid[1])*w[1]<0)w=[-w[0],-w[1]]}else if(w[1]<0)w=[-w[0],-w[1]];
    g.line([p[0]+w[0]*4.5,p[1]+w[1]*4.5],[q[0]+w[0]*4.5,q[1]+w[1]*4.5],c,2)};
  for(let k=0;k<n-1;k++){
    g.line(P[k],P[k+1],col(atoms[k+1]),2);
    if(atoms[k].dbl)dbl(P[k],P[k+1],col(atoms[k+1]),dblToward[k]||cen);

    if(rel.kind==='acid')g.text('HO',3,0,c0,13);
    else{g.text('S',0,0,'#b45309',13);
      const w=snap.carr==='T'?30:40;g.lb.push(`<rect x="14" y="-11" width="${w}" height="22" rx="11" fill="#fbc98e" stroke="#b45309" stroke-width="1.5"/><text x="${14+w/2}" y="1" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#5a2d00" font-family="IBM Plex Sans,system-ui,sans-serif">${snap.carr==='T'?'T':'ACP'}</text>`);g.bb(14+w,0,4)}

    });
    if(a.aa&&!a.ring)drawTree(g,SC[a.aa]||[],[0,0],0,c,(la,lb_)=>pt(k,la,lb_));
    if(opts.nums&&a.el==='C'){const q=pt(k,0,-12);g.text(String(cnum),q[0],q[1],'#8a94a3',9)}
  });

}
function drawTree(g,nodes,p0,dir,c,fr){
  nodes.forEach(nd=>{
    if(nd[0]==='ring'){
      const th=(dir+nd[1])*Math.PI/180,L=nd[2],e=[p0[0]+L*Math.sin(th),p0[1]+L*Math.cos(th)];

      const sc=(v,t)=>[ctr[0]+(v[0]-ctr[0])*t,ctr[1]+(v[1]-ctr[1])*t];
      for(let i=0;i<6;i++){g.line(fr(...V[i]),fr(...V[(i+1)%6]),c)}
      for(const i of[1,3,5]){const a=sc(V[i],.72),b=sc(V[(i+1)%6],.72);g.line(fr(...a),fr(...b),c,1.6)}
      if(nd[3]){const q=V[3],q2=[q[0]+20*Math.sin(th),q[1]+20*Math.cos(th)];g.line(fr(...q),fr(...q2),c);g.text(nd[3],...fr(q[0]+30*Math.sin(th),q[1]+30*Math.cos(th)),c,13)}
      return;
    }
    const[ang,len,label,db,kids]=nd,th=(dir+ang)*Math.PI/180,e=[p0[0]+len*Math.sin(th),p0[1]+len*Math.cos(th)];
    if(db){const o=[2.4*Math.cos(th),-2.4*Math.sin(th)];
      g.line(fr(p0[0]+o[0],p0[1]+o[1]),fr(e[0]+o[0],e[1]+o[1]),c);g.line(fr(p0[0]-o[0],p0[1]-o[1]),fr(e[0]-o[0],e[1]-o[1]),c)}
    else g.line(fr(...p0),fr(...e),c);
    if(label)g.text(label,...fr(p0[0]+(len+10)*Math.sin(th),p0[1]+(len+10)*Math.cos(th)),c,13);
    if(kids)drawTree(g,kids,e,dir+ang,c,fr);
  });
}

function findPiece(id){for(let mi=0;mi<S.modules.length;mi++){const i=S.modules[mi].domains.findIndex(p=>p.id===id);if(i>=0)return{mi,i,p:S.modules[mi].domains[i],where:'mod'}}
  const i=S.trans.findIndex(p=>p.id===id);if(i>=0)return{i,p:S.trans[i],where:'lane'};return null}
function detach(id){const f=findPiece(id);if(!f)return null;
  if(f.where==='lane'){S.trans.splice(f.i,1);return f.p}
  const m=S.modules[f.mi];m.domains.splice(f.i,1);if(!m.domains.length)S.modules.splice(f.mi,1);return f.p}
function removePiece(id){detach(id);if(sel>=S.modules.length)sel=-1;commit()}
function moveMod(mi,dx){const j=mi+dx;if(j<0||j>=S.modules.length)return;[S.modules[mi],S.modules[j]]=[S.modules[j],S.modules[mi]];sel=j;commit()}

function addByClick(type,cls){
  const p=newPiece(type,cls);

  else if(sel>=0&&S.modules[sel])S.modules[sel].domains.push(p);
  else{S.modules.push(newMod([p]));sel=S.modules.length-1}
  commit();
}
function commit(){

let dragging=false;
function startDrag(e,pl,srcEl){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const sx=e.clientX,sy=e.clientY;let started=false,ghost=$('#ghost'),target=null;
  const typeCls=pl.cls;
  const begin=()=>{
    started=true;dragging=true;document.body.style.userSelect='none';try{getSelection().removeAllRanges()}catch(_){}
    ghost.replaceChildren(domEl(pl.type,typeCls));ghost.hidden=false;
    if(pl.src!=='pal'){srcEl.classList.add('ghosted');$('#palette').classList.add('trash')}
  };
  const hit=(x,y)=>{
    const els=document.elementsFromPoint(x,y);
    const g=els.find(n=>n.classList&&n.classList.contains('gap'));if(g)return{kind:'gap',gi:+g.dataset.gi,node:g};
    const m=els.find(n=>n.classList&&n.classList.contains('mod'));if(m)return{kind:'mod',mi:+m.dataset.mi,node:m};
    const l=els.find(n=>n.id==='lane');if(l)return{kind:'lane',node:l};
    const bw=els.find(n=>n.id==='boardWrap');if(bw)return{kind:'board',node:bw};
    const pal=els.find(n=>n.id==='palette');if(pal)return{kind:'pal',node:pal};
    return{kind:'none'};
  };
  const insIndex=(t,x)=>{const m=S.modules[t.mi];const pcs=$$('.pc',t.node);let idx=m.domains.length;
    for(let i=0;i<pcs.length;i++){const r=pcs[i].getBoundingClientRect();if(x<r.left+r.width/2){idx=i;break}}
    return idx};
  const verdict=t=>{
    if(t.kind==='pal')return pl.src==='pal'?false:true;
    if(pl.type==='tAT')return['gap','mod','lane','board'].includes(t.kind);
    return['gap','mod','board'].includes(t.kind);
  };
  const clear=()=>{$$('.drop-ok,.drop-bad').forEach(n=>n.classList.remove('drop-ok','drop-bad'));$$('.ins-before').forEach(n=>n.classList.remove('ins-before'));$$('.ins-end').forEach(n=>n.classList.remove('ins-end'))};
  let lastX=sx,lastY=sy,scr=null;
  const autoScroll=()=>{const bw=$('#boardWrap'),r=bw.getBoundingClientRect();if(lastY>r.top-24&&lastY<r.bottom+24){if(lastX<r.left+56)bw.scrollLeft-=22;else if(lastX>r.right-56)bw.scrollLeft+=22}};
  const move=ev=>{
    lastX=ev.clientX;lastY=ev.clientY;if(started&&!scr)scr=setInterval(autoScroll,30);
    if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<5)return;begin()}
    ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
    clear();target=hit(ev.clientX,ev.clientY);
    const ok=verdict(target);
    if(target.kind==='mod'){target.node.classList.add(ok?'drop-ok':'drop-bad');
      if(ok){const idx=insIndex(target,ev.clientX),pcs=$$('.pc',target.node);if(idx<pcs.length)pcs[idx].classList.add('ins-before');else $('.mdom',target.node).classList.add('ins-end');target.idx=idx}}
    else if(target.kind==='gap'&&ok)target.node.classList.add('drop-ok');
    else if(target.kind==='board'&&ok&&pl.type!=='tAT'){const lg=$('.gap.last');if(lg)lg.classList.add('drop-ok')}
    else if(target.kind==='lane'||(target.kind==='board'&&pl.type==='tAT')){const ln=$('#lane');ln.classList.add(ok?'drop-ok':'drop-bad')}
    else if(target.kind==='lane')$('#lane').classList.add('drop-bad');
    if(target.kind==='lane'&&pl.type!=='tAT')$('#lane').classList.add('drop-bad');
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);clearInterval(scr);
    if(!started){if(pl.src==='pal')addByClick(pl.type,pl.cls);else if(pl.src!=='pal'){const f=findPiece(pl.id);if(f&&f.where==='mod'){sel=f.mi;renderBoard()}}return}
    dragging=false;document.body.style.userSelect='';ghost.hidden=true;clear();srcEl.classList.remove('ghosted');$('#palette').classList.remove('trash');
    const t=ev.type==='pointercancel'?{kind:'none'}:hit(ev.clientX,ev.clientY);
    if(t.kind==='mod')t.idx=insIndex(t,ev.clientX);
    drop(pl,t);
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function drop(pl,t){
  if(t.kind==='pal'){if(pl.src!=='pal'){removePiece(pl.id)}return}
  if(t.kind==='none'){return}
  const isT=pl.type==='tAT';
  if(t.kind==='board'&&!isT)t={kind:'gap',gi:S.modules.length};
  if(isT){
    if(!['gap','mod','lane','board'].includes(t.kind))return;
    if(pl.src==='pal'){S.trans.push(newPiece('tAT',pl.cls))}
    commit();return;
  }
  if(t.kind==='lane'){toast(L({en:'Only a free-standing trans-AT protein goes in the discrete-enzyme lane. Drop domains onto a module.',vi:'Chỉ protein trans-AT rời mới đặt ở làn enzyme rời. Hãy thả domain vào module.'}));return}
  // resolve anchors by id before detaching
  const beforeId=t.kind==='gap'?(S.modules[t.gi]?S.modules[t.gi].id:null):null;
  const modId=t.kind==='mod'?S.modules[t.mi].id:null;
  let idxInMod=t.idx;
  let p;
  if(pl.src==='pal')p=newPiece(pl.type,pl.cls);
  else{
    if(t.kind==='mod'){const f=findPiece(pl.id);if(f&&f.where==='mod'&&S.modules[f.mi].id===modId&&f.i<idxInMod)idxInMod--}
    p=detach(pl.id);if(!p)return;
  }
  if(t.kind==='gap'){
    const bi=beforeId?S.modules.findIndex(m=>m.id===beforeId):S.modules.length;
    S.modules.splice(bi<0?S.modules.length:bi,0,newMod([p]));sel=bi<0?S.modules.length-1:bi;
  }else{
    const mi=S.modules.findIndex(m=>m.id===modId);
    if(mi<0){S.modules.push(newMod([p]));sel=S.modules.length-1}
    else{S.modules[mi].domains.splice(Math.max(0,Math.min(idxInMod,S.modules[mi].domains.length)),0,p);sel=mi}
  }
  commit();
}

const h53=(str)=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const VALS={C:[4],N:[3,5],O:[2],S:[2,4,6],P:[3,5],F:[1],Cl:[1],Br:[1],I:[1],B:[3],Se:[2,4]};
const FR={Gly:'',Ala:'C',Val:'C(C)C',Leu:'CC(C)C',Ile:'C(C)CC',Phe:'Cc1ccccc1',Tyr:'Cc1ccc(O)cc1',Ser:'CO',Thr:'C(C)O',Cys:'CS',Asp:'CC(=O)O',Glu:'CCC(=O)O'};

function adjOf(g){const adj=g.a.map(()=>[]);g.b.forEach(([x,y,o],bi)=>{adj[x].push({j:y,o,bi});adj[y].push({j:x,o,bi})});return adj}

/* ---------- numbering & explanations ---------- */
function chainList(units){const l=[];units.forEach(u=>{if(u.t==='st')l.push(u.c1,...u.tailC);else if(u.t==='pk')l.push(u.c1,u.ca);else l.push(u.c1,u.ca,u.n)});return l}
function carbonNumbers(units){
  const num=new Map();let c=0;

    if(u.t==='st'){num.set(u.c1,++c);u.tailC.forEach(a=>num.set(a,++c));u.tailTo=c}

      head=L({en:'Extension module',vi:'Module kéo dài'})+(mt.n>1?` ×${mt.n}`:'');
      lines.push(L({en:`Adds C${mt.n>1?num.get(u.c1)+'…':c1}–C${ca}: ${SUBNAME[e.sub]}${mode==='trans'?' (trans-AT)':''}${e.mt?' + C-MT (gem-substituted α-carbon)':''}.`,vi:`Thêm C${mt.n>1?num.get(u.c1)+'…':c1}–C${ca}: ${SUBNAME[e.sub]}${mode==='trans'?' (trans-AT)':''}${e.mt?' + C-MT (carbon α có hai nhóm thế)':''}.`}));
      const bc=mt.n>1?'…':num.get((below||{}).c1);

  });

    const unc=new Set(c.unc),keep=[],map={};g.a.forEach((a,i)=>{if(!unc.has(i)){map[i]=keep.length;keep.push({...a})}});
    g.b.forEach(([x,y,o])=>{const kx=!unc.has(x),ky=!unc.has(y);if(kx&&!ky)keep[map[x]].h+=o;else if(!kx&&ky)keep[map[y]].h+=o});

function molToEditor(g){ // scale a molfile layout into the editor

}

   {en:'Add DH. Water is lost and a C=C appears. Add ER. The C=C is saturated.',vi:'Thêm DH. Mất nước và xuất hiện liên kết đôi C=C. Thêm ER. Liên kết đôi được khử bão hòa.'},
   {en:'Now drag DH out onto the palette. Read the Check box: what does the tool say about ER?',vi:'Bây giờ kéo DH ra thả vào bảng domain. Đọc ô Check: công cụ nói gì về ER?'},
   {en:'Put DH back so that module 2 has KS, AT, KR, DH, ER and ACP, with TE.',vi:'Đặt DH lại để module 2 có KS, AT, KR, DH, ER và ACP, kèm TE.'}],
  hint:{en:'The order you drag them does not matter. The tool always applies KR, then DH, then ER. Final product: butanoic acid, C₄H₈O₂.',vi:'Thứ tự kéo không quan trọng. Công cụ luôn áp dụng KR, rồi DH, rồi ER. Sản phẩm cuối: acid butanoic, C₄H₈O₂.'},
  q:{en:'Why does ER do nothing when DH is missing?',vi:'Vì sao ER không làm gì khi thiếu DH?'},
  a:{en:'ER reduces a C=C, and only DH makes that C=C from the hydroxyl made by KR.',vi:'ER khử liên kết đôi C=C, mà chỉ DH mới tạo C=C đó từ nhóm hydroxyl do KR tạo ra.'},
  check:()=>{const m=S.modules.find(m=>hasT(m,'KS')&&hasT(m,'KR')&&hasT(m,'DH')&&hasT(m,'ER'));
    if(m&&fmNow()==='C4H8O2'&&!anyErr())return right('Correct: fully reduced, butanoic acid C₄H₈O₂.','Đúng: khử hoàn toàn, acid butanoic C₄H₈O₂.');
    const c=cur();return wrong(c.en+' Target C₄H₈O₂, with KR, DH and ER together in the KS module.',c.vi+' Mục tiêu C₄H₈O₂, có KR, DH và ER cùng module với KS.')}},
 {id:'t3',min:3,
  t:{en:'3 · Choose the extender, add a module',vi:'3 · Chọn đơn vị kéo dài, thêm module'},
  goal:{en:'Learn that the AT substrate decides branches, and that each extra module adds two carbons.',vi:'Hiểu rằng cơ chất của AT quyết định nhánh, và mỗi module thêm hai carbon.'},
  steps:[
   {en:'Build the two-module line from the lecture: Loading AT (Acetyl) + ACP.',vi:'Xây dây chuyền hai module trong bài giảng: module nạp AT (Acetyl) + ACP.'},
   {en:'Module 1: KS, AT = Malonyl, KR, ACP.',vi:'Module 1: KS, AT = Malonyl, KR, ACP.'},
   {en:'Module 2: KS, AT = Methylmalonyl, KR, DH, ER, ACP, then TE.',vi:'Module 2: KS, AT = Methylmalonyl, KR, DH, ER, ACP, rồi TE.'},
   {en:'The goal is 5-hydroxy-2-methylhexanoic acid, C₇H₁₄O₃. Tip: open Examples & targets to see the target; it turns green when you match it.',vi:'Mục tiêu là acid 5-hydroxy-2-methylhexanoic, C₇H₁₄O₃. Mẹo: mở Examples & targets để xem mục tiêu; mục tiêu sẽ chuyển xanh khi bạn khớp.'}],
  hint:{en:'Only module 1 has the KR alone; module 2 has the full KR–DH–ER set. If stuck, load the first example from Examples & targets and study it.',vi:'Chỉ module 1 có KR đơn; module 2 có đủ KR–DH–ER. Nếu kẹt, nạp ví dụ đầu tiên trong Examples & targets rồi quan sát.'},
  q:{en:'Where does the methyl branch on carbon 2 come from?',vi:'Nhánh methyl ở carbon 2 đến từ đâu?'},
  a:{en:'From the methylmalonyl-CoA chosen by the AT of module 2. A malonyl AT would give no branch.',vi:'Từ methylmalonyl-CoA do AT của module 2 chọn. AT malonyl sẽ không tạo nhánh.'},
  check:()=>{if(fmNow()==='C7H14O3'&&SIM.released&&!anyErr())return right('Correct: 5-hydroxy-2-methylhexanoic acid, C₇H₁₄O₃.','Đúng: acid 5-hydroxy-2-methylhexanoic, C₇H₁₄O₃.');
    const c=cur();return wrong(c.en+' Target C₇H₁₄O₃.',c.vi+' Mục tiêu C₇H₁₄O₃.')}},
 {id:'t4',min:3,
  t:{en:'4 · Rings and removing a domain',vi:'4 · Vòng và việc bỏ một domain'},
  goal:{en:'See how a TE makes a macrolactone and why ring size depends on which β-hydroxyls exist.',vi:'Thấy TE tạo macrolactone và kích thước vòng phụ thuộc vào các β-hydroxyl hiện có.'},
  setup:{label:{en:'Load DEBS (6-dEB)',vi:'Nạp DEBS (6-dEB)'},fn:PRESETS.debs},
  steps:[
   {en:'Load DEBS. The product is a 14-membered lactone. Click the TE: it is set to Cyclisation and automatically uses the farthest hydroxyl.',vi:'Nạp DEBS. Sản phẩm là lactone 14 cạnh. Bấm vào TE: đang đặt Cyclisation và tự dùng hydroxyl xa nhất.'},
   {en:'Drag the KR out of module 1 (the first extension module) and drop it on the palette.',vi:'Kéo KR ra khỏi module 1 (module kéo dài đầu tiên) rồi thả vào bảng domain.'},
   {en:'Watch the ring: it shrinks. The farthest OH is gone, so the TE closes the ring on the next OH.',vi:'Quan sát vòng: nó nhỏ lại. OH xa nhất đã mất nên TE đóng vòng ở OH kế tiếp.'},
   {en:'Goal: a 12-membered lactone, C₂₁H₃₆O₆.',vi:'Mục tiêu: lactone 12 cạnh, C₂₁H₃₆O₆.'}],

  a:{en:'The TE attacks with the farthest hydroxyl in the chain. Without the first β-OH, the farthest one is nearer to carbon 1, so the ring has fewer atoms.',vi:'TE tấn công bằng hydroxyl xa nhất trong chuỗi. Khi thiếu β-OH đầu tiên, OH xa nhất gần C1 hơn nên vòng có ít nguyên tử hơn.'},
  check:()=>{const f=SIM&&SIM.final;if(f&&f.rel&&f.rel.kind==='lactone'&&f.rel.size===12&&fmNow()==='C21H36O6')return right('Correct: 12-membered lactone, C₂₁H₃₆O₆.','Đúng: lactone 12 cạnh, C₂₁H₃₆O₆.');
    const c=cur();return wrong(c.en+' Ring size now: '+((f&&f.rel&&f.rel.size)||'none')+'. Target 12 and C₂₁H₃₆O₆.',c.vi+' Kích thước vòng hiện tại: '+((f&&f.rel&&f.rel.size)||'không có')+'. Mục tiêu 12 và C₂₁H₃₆O₆.')}},
 {id:'t5',min:3,
  t:{en:'5 · An NRPS line',vi:'5 · Dây chuyền NRPS'},
  goal:{en:'Use the orange NRPS area: A picks the amino acid, T carries it, C makes the amide bond, Cy also closes a ring.',vi:'Dùng vùng NRPS màu cam: A chọn amino acid, T mang, C tạo liên kết amide, Cy còn đóng vòng.'},

   {en:'Module 1: A (choose Ile) + T. The first module needs no C.',vi:'Module 1: A (chọn Ile) + T. Module đầu không cần C.'},
   {en:'Module 2: C + A (Ala) + T.',vi:'Module 2: C + A (Ala) + T.'},
   {en:'Module 3: Cy + A (Cys) + T + TE (from the grey area).',vi:'Module 3: Cy + A (Cys) + T + TE (từ vùng xám).'},
   {en:'Look at the product: a thiazoline ring at the end. Swap Cy for C and compare.',vi:'Nhìn sản phẩm: vòng thiazoline ở cuối. Đổi Cy thành C và so sánh.'}],
  hint:{en:'Put Cy back in the end. Target Ile–Ala–Cys thiazoline, C₁₂H₂₁N₃O₃S.',vi:'Đặt Cy lại ở cuối. Mục tiêu Ile–Ala–Cys thiazoline, C₁₂H₂₁N₃O₃S.'},
  q:{en:'What did the Cy domain do that C does not?',vi:'Domain Cy làm được điều gì mà C không làm?'},
  a:{en:'After forming the amide, Cy lets the Cys side-chain SH attack the carbonyl, losing water and closing the thiazoline ring.',vi:'Sau khi tạo amide, Cy cho nhóm SH của Cys tấn công carbonyl, mất nước và đóng vòng thiazoline.'},

    const c=cur();return wrong(c.en+' Target C₁₂H₂₁N₃O₃S, with a Cy domain.',c.vi+' Mục tiêu C₁₂H₂₁N₃O₃S, có domain Cy.')}},
 {id:'t6',min:4,
  t:{en:'6 · Predict the line from a structure',vi:'6 · Dự đoán dây chuyền từ cấu trúc'},
  goal:{en:'Work backwards: read a product and recover the starter, extenders and reductive domains.',vi:'Làm ngược: đọc sản phẩm rồi tìm lại starter, đơn vị kéo dài và các domain khử.'},
  steps:[
   {en:'Press “Open predictor with the mystery structure” below. It pastes a SMILES for you.',vi:'Bấm “Mở công cụ dự đoán với cấu trúc bí ẩn” bên dưới. Nó dán sẵn SMILES cho bạn.'},
   {en:'Press Predict assembly line. Hover over each module card: the matching part of the structure lights up.',vi:'Bấm Predict assembly line. Rê chuột lên từng module: phần cấu trúc tương ứng được làm nổi.'},
   {en:'Answer the three questions below from the prediction.',vi:'Trả lời ba câu hỏi bên dưới dựa trên dự đoán.'}],
  inputs:[
   {k:'n',label:{en:'How many extension modules (with KS)?',vi:'Có bao nhiêu module kéo dài (có KS)?'},opts:['2','3','4','5'],ans:'3'},
   {k:'er',label:{en:'Which extension module has an ER?',vi:'Module kéo dài nào có ER?'},opts:['none','1','2','3'],ans:'3'},
   {k:'e1',label:{en:'Extender used by extension module 1?',vi:'Đơn vị kéo dài của module kéo dài 1?'},opts:['Malonyl','Methylmalonyl','Ethylmalonyl'],ans:'Methylmalonyl'}],
  special:'predict',
  hint:{en:'In the card list, the first card is the loading module; extension modules are the cards that contain KS. The methyl branch at C2 tells you the extender.',vi:'Trong danh sách, thẻ đầu là module nạp; module kéo dài là các thẻ có KS. Nhánh methyl ở C2 cho biết đơn vị kéo dài.'},
  q:{en:'Why can the tool not tell whether a methyl came from methylmalonyl or from an MT domain?',vi:'Vì sao công cụ không phân biệt được methyl đến từ methylmalonyl hay từ domain MT?'},
  a:{en:'Both routes give exactly the same molecule. The structure holds no trace of how the methyl got there.',vi:'Cả hai con đường cho cùng một phân tử. Cấu trúc không lưu dấu vết methyl được thêm bằng cách nào.'},
  check:()=>{const o=PD.out&&PD.out.R;
    if(!o||!o.ok)return wrong('Run the prediction on the mystery structure first.','Hãy chạy dự đoán cho cấu trúc bí ẩn trước.');
    if(o.formulaIn!==graphFormula(parseSMILES(mystSmi())))return wrong('The prediction is for a different structure. Use the mystery SMILES.','Dự đoán là của cấu trúc khác. Hãy dùng SMILES bí ẩn.');
    const A=PRTASKS.find(t=>t.id==='t6').inputs,bad=A.filter(i=>(PR.ans['t6.'+i.k]||'')!==i.ans);
    if(bad.length)return wrong('Prediction done. Check these answers again: '+bad.map(b=>b.label.en).join('; '),'Đã dự đoán. Kiểm tra lại các câu: '+bad.map(b=>b.label.vi).join('; '));
    return right('All correct. You read a structure back into modules.','Tất cả đều đúng. Bạn đã đọc ngược cấu trúc thành các module.')}},
 {id:'t7',bonus:true,min:3,

    return wrong('Draw 3-hydroxybutanoic acid (C4H8O3) in the Draw tab, then press Predict.','Vẽ acid 3-hydroxybutanoic (C4H8O3) trong tab Draw rồi bấm Predict.')}},
 {id:'t8',bonus:true,min:3,
  t:{en:'Bonus B · trans-AT',vi:'Thưởng B · trans-AT'},

/* ---------- gate + tab ---------- */
function prLabels(){
  const t=$('#tabPr'),s=$('#tabSb'),f=$('#tabFr');if(!t)return;
  s.textContent=L({en:'Sandbox',vi:'Sandbox'});
  t.textContent=L({en:'Step by step examples',vi:'Ví dụ từng bước'});
  f.textContent=L({en:'Practice',vi:'Luyện tập'});
  s.setAttribute('aria-pressed',String(!PR.open));t.setAttribute('aria-pressed',String(PR.mode==='guide'));f.setAttribute('aria-pressed',String(PR.mode==='free'));
}
function prSet(mode){
  PR.mode=mode;PR.open=!!mode;PR.openId=null;PR.err=false;document.body.classList.toggle('prac',PR.open);prLabels();prRender();
}
function prUnlock(){
  const v=($('#prpass')||{}).value||'';
  if(h53(v.trim().toLowerCase())===PR_HASH[PR.mode]){PR.unl[PR.mode]=true;PR.err=false;try{sessionStorage.setItem(PR.mode==='free'?'alsb.pr.u2':'alsb.pr.u','1')}catch(e){}prLabels();prRender()}
  else{PR.err=true;prRender();const i=$('#prpass');if(i)i.focus()}
}
function prApply(fn){S=fn();sel=-1;view='final';commit();toast(L({en:'Loaded. Now continue with the steps.',vi:'Đã nạp. Hãy tiếp tục các bước.'}))}
function prOpenPredictor(mode){
  $('#drawer').classList.remove('on');
  if(mode==='draw'){PD.tab='draw'}else{PD.tab='paste';PD.text=mode==='paste2'?myst2Smi():mystSmi()}
  PD.out=null;pdBuild();$('#pdrawer').classList.add('on');
}
function prRender(){
  const d=$('#prac');if(!d)return;d.replaceChildren();if(!PR.open)return;
  const head=el('div',{class:'prhead'},el('h2',{},PR.mode==='free'?L({en:'Practice',vi:'Luyện tập'}):L({en:'Step by step examples',vi:'Ví dụ từng bước'})),
    el('button',{class:'btn sm',onclick:()=>prSet(false)},L({en:'Back to sandbox',vi:'Về sandbox'})));
  d.append(head);
  d.append(el('div',{class:'lockbar'+(PR.unl[PR.mode]?' open':'')},
    PR.unl[PR.mode]?[el('span',{},'🔓 '+L({en:'Answers unlocked: use “Show answer” under each task.',vi:'Đã mở đáp án: dùng “Hiện đáp án” dưới mỗi bài.'})),
      el('button',{class:'btn sm',onclick:()=>{PR.unl[PR.mode]=false;PR.rev={};try{sessionStorage.removeItem(PR.mode==='free'?'alsb.pr.u2':'alsb.pr.u')}catch(e){}prRender()}},L({en:'Lock',vi:'Khóa'}))]
    :[el('span',{},'🔒 '+L({en:'Answers are locked',vi:'Đáp án đang khóa'})),
      el('input',{id:'prpass',type:'password',autocomplete:'off','aria-label':'Teacher code',placeholder:L({en:'Teacher code',vi:'Mã giáo viên'}),onkeydown:e=>{if(e.key==='Enter')prUnlock()}}),
      el('button',{class:'btn pri sm',onclick:prUnlock},L({en:'Unlock',vi:'Mở khóa'})),
      PR.err?el('span',{class:'prerr'},L({en:'Wrong code',vi:'Sai mã'})):null]));
  const LIST=PR.mode==='free'?PRFREE:PRTASKS;
  const core=LIST.filter(t=>!t.bonus),nd=core.filter(t=>PR.done[t.id]).length;
  d.append(el('p',{class:'prhint'},(PR.mode==='free'?L({en:'No step-by-step guide here. Read each goal, work it out on your own, then press “Check my work”. Answer the short questions where asked.',vi:'Không có hướng dẫn từng bước. Đọc mục tiêu, tự làm, rồi bấm “Kiểm tra bài làm”. Trả lời các câu hỏi ngắn nếu có.'}):L({en:'About 20 minutes. Work through the tasks in order. Press “Check my work” after each: the tool tests your line automatically.',vi:'Khoảng 20 phút. Làm lần lượt các bài. Bấm “Kiểm tra bài làm” sau mỗi bài: công cụ tự kiểm tra dây chuyền của bạn.'}))),
    el('div',{class:'prbar','aria-label':'progress'},el('i',{style:'width:'+(100*nd/core.length)+'%'})),
    el('div',{class:'prcount'},nd+' / '+core.length+' '+L({en:'core tasks done',vi:'bài chính đã xong'})));
  if(PR.openId==null){const f=LIST.find(t=>!PR.done[t.id]);PR.openId=f?f.id:null}
  LIST.forEach(t=>{
    const done=!!PR.done[t.id];
    const card=el('details',{class:'prtask'+(done?' done':''),open:PR.openId===t.id});
    card.addEventListener('toggle',()=>{if(card.open)PR.openId=t.id});
    card.append(el('summary',{},el('span',{class:'prmark'},done?'✓':''),el('b',{},L(t.t)),el('span',{class:'prmin'},'~'+t.min+' '+L({en:'min',vi:'phút'}))));
    const body=el('div',{class:'prbody'});
    body.append(el('p',{class:'prgoal'},el('b',{},L({en:'Goal: ',vi:'Mục tiêu: '})),L(t.goal)));
    if(t.setup)body.append(el('button',{class:'btn sm',onclick:()=>prApply(t.setup.fn)},L(t.setup.label)));
    if(t.special==='predict')body.append(el('button',{class:'btn sm',onclick:()=>prOpenPredictor('paste')},L({en:'Open predictor with the mystery structure',vi:'Mở công cụ dự đoán với cấu trúc bí ẩn'})));
    if(t.special==='predict2')body.append(el('button',{class:'btn sm',onclick:()=>prOpenPredictor('paste2')},L({en:'Open the predictor with this structure',vi:'Mở công cụ dự đoán với cấu trúc này'})));
    if(t.special==='draw')body.append(el('button',{class:'btn sm',onclick:()=>prOpenPredictor('draw')},L({en:'Open the drawing tool',vi:'Mở công cụ vẽ'})));
    if(t.steps&&PR.mode!=='free')body.append(el('ol',{},t.steps.map(s=>el('li',{},L(s)))));
    if(t.task&&PR.mode==='free')body.append(el('p',{class:'prtaskp'},L(t.task)));
    if(t.inputs)t.inputs.forEach(i=>{
      const sel_=el('select',{class:'opt',onchange:e=>{PR.ans[t.id+'.'+i.k]=e.target.value;prSave()}},el('option',{value:''},'—'),i.opts.map(o=>el('option',{value:o,selected:PR.ans[t.id+'.'+i.k]===o},o)));
      body.append(el('label',{class:'prq'},el('span',{},L(i.label)),sel_));
    });
    const msg=PR.msg[t.id];
    const fb=el('div',{class:'prfb'+(msg?(msg.ok?' ok':' no'):'')},msg?L(msg.msg):'');
    body.append(el('div',{class:'pract'},el('button',{class:'btn pri sm',onclick:()=>{const r=t.check();PR.msg[t.id]=r;if(r.ok)PR.done[t.id]=true;prSave();PR.openId=t.id;prRender()}},L({en:'Check my work',vi:'Kiểm tra bài làm'}))),fb);
    if(t.hint&&PR.mode!=='free')body.append(el('details',{class:'prx'},el('summary',{},L({en:'Hint',vi:'Gợi ý'})),el('p',{},L(t.hint))));
    if(t.q)body.append(el('p',{class:'prthink'},el('b',{},L({en:'Think: ',vi:'Suy nghĩ: '})),L(t.q)));
    if(PR.unl[PR.mode]){
      const rv=!!PR.rev[t.id];
      body.append(el('button',{class:'btn sm',style:'align-self:flex-start',onclick:()=>{PR.rev[t.id]=!rv;PR.openId=t.id;prRender()}},rv?L({en:'Hide answer',vi:'Ẩn đáp án'}):L({en:'Show answer',vi:'Hiện đáp án'})));
      if(rv){
        const box=el('div',{class:'pransw'},t.a?el('p',{},L(t.a)):null);
        if(t.sol)box.append(el('button',{class:'btn sm',onclick:()=>prApply(t.sol)},L({en:'Load the solution line',vi:'Nạp dây chuyền đáp án'})));
        if(t.inputs)box.append(el('p',{},L({en:'Answers: ',vi:'Đáp án: '})+t.inputs.map(i=>i.ans).join(' · ')));
        body.append(box);
      }
    }
    card.append(body);d.append(card);
  });
  d.append(el('button',{class:'btn sm',style:'align-self:flex-start',onclick:()=>{if(!PR.cr){PR.cr=true;prRender();return}PR.cr=false;PR.done={};PR.ans={};PR.msg={};PR.openId=null;prSave();prRender()}},PR.cr?L({en:'Click again to erase all progress',vi:'Bấm lần nữa để xóa toàn bộ tiến độ'}):L({en:'Reset progress',vi:'Đặt lại tiến độ'})));
}
$('#tabSb').onclick=()=>prSet(null);
$('#tabPr').onclick=()=>prSet('guide');
$('#tabFr').onclick=()=>prSet('free');
prLabels();
(()=>{const g=id=>PRTASKS.find(t=>t.id===id);
  g('t1').sol=sol1;
  g('t2').sol=()=>({trans:[],modules:[newMod([C_('AT',{sub:'ace'}),C_('ACP')]),newMod([C_('KS'),C_('AT',{sub:'mal'}),C_('KR'),C_('DH'),C_('ER'),C_('ACP'),R_('TE')])]});
  g('t3').sol=PRESETS.hexa;
  g('t4').sol=()=>{const d=PRESETS.debs();d.modules[1].domains=d.modules[1].domains.filter(x=>x.type!=='KR');return d};
  g('t5').sol=PRESETS.nrps;
  g('t8').sol=()=>{const f=PRESETS.fr9();f.trans[0].opts.sub='mmal';return f};
})();
window.__prac={prApply,PR,PRTASKS,PRFREE,prRender,prSet,mystSmi,sol1,mystLine};

/* ====================================================================
   boot
   ==================================================================== */
try{const saved=JSON.parse(localStorage.getItem('alsb.v1')||'null');
  if(saved&&saved.S&&Array.isArray(saved.S.modules)){S=saved.S;lang=saved.lang==='vi'?'vi':'en';showNums=!!saved.nums;$('#cNum').checked=showNums}}catch(e){}
if(!S.modules.length&&!S.trans.length)S=PRESETS.hexa();
hist=[JSON.stringify({S,sel})];hi=0;
renderPalette();applyLang();refresh();
window.__sim={get S(){return S},set S(v){S=v},simulate,PRESETS,formulaStr,massOf,commit,refresh,structSVG,get SIM(){return SIM},newPiece,newMod,setView(v){view=v;renderViewer()}};
})();
